services:

  ros2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ros2_jazzy

    environment:
      ROS_DISTRO: jazzy
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      CYCLONEDDS_URI: file:///ros2_ws/config/cyclonedds.xml

    volumes:

      - ${HOME}/ros2_ws:/ros2_ws

      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    working_dir: /ros2_ws

    stdin_open: true
    tty: true

    restart: unless-stopped

    network_mode: host

    command: bash